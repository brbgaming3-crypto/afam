<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Will you go out with me?</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#fff;transition:background .4s ease}.app{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;transition:background .4s ease}.modal{position:relative;width:95%;max-width:420px;height:100%;min-height:560px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .4s ease}h1{position:absolute;top:10%;left:20px;right:20px;max-height:24%;overflow:visible;margin:0;font-size:24px;letter-spacing:1px;font-weight:700;transition:all .4s ease}.face{position:absolute;left:50%;top:36%;width:80px;height:80px;transform:translateY(-50%);display:grid;place-items:center;animation:shake 1.2s ease-in-out infinite;transition:all .4s ease;z-index:2;pointer-events:none}.face.hidden{display:none}.face img{width:100%;height:100%;object-fit:contain;border-radius:14px;display:block}.face{contain:layout paint}.buttons{position:absolute;left:20px;right:20px;bottom:18%;display:flex;align-items:center;justify-content:center;gap:20px;min-height:70px;transition:all .4s ease;z-index:10}.buttons button,.continue{font-family:inherit;cursor:pointer;transition:all .4s ease}.yes{color:#fff;background:rgba(255,80,120,.3);border:2px solid #ff5078;padding:12px 30px;border-radius:40px;font-size:18px}.no{color:#fff;background:transparent;border:1px solid #aaa;padding:10px 24px;border-radius:40px;font-size:16px}.sub{position:absolute;top:56%;left:20px;right:20px;margin:0;font-size:14px;opacity:.7;transition:all .4s ease;z-index:4}.hidden{display:none!important}.continue{position:absolute;bottom:8%;border:0;border-radius:60px;padding:16px 40px;font-size:22px;color:#fff;background:linear-gradient(135deg,#ff4d6d,#c1121f);box-shadow:0 0 30px #ff4d6d;animation:pulse 1.5s ease-in-out infinite;z-index:5}.date{width:80%;padding:12px 20px;border:2px solid #ff4d6d;border-radius:30px;font-size:18px;text-align:center;outline:0;margin:18px 0}.hearts,.particles,.floating{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:all .4s ease}.hearts{opacity:0}.hearts:before{content:"♥   ♥     ♥  ♥    ♥      ♥   ♥    ♥     ♥   ♥";position:absolute;inset:-15%;font-size:34px;line-height:2.4;letter-spacing:20px;color:rgba(255,80,120,.22);transform:rotate(-12deg)}.particles{opacity:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:35px 35px;animation:drift 8s linear infinite}.floating{opacity:0}.floating span{position:absolute;font-size:25px;animation:up 3s linear infinite}.floating span:nth-child(3n){font-size:20px}.floating span:nth-child(4n){font-size:30px}.floating span{filter:drop-shadow(0 2px 4px rgba(120,30,80,.12))}.modal{z-index:2}.app:after{content:'';position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.12) 0 2px,transparent 3px);background-size:70px 70px;animation:drift 12s linear infinite;opacity:.35}.postcat{width:100px;height:100px;object-fit:contain;margin-top:18px;border-radius:14px}.confirmcat{display:block;margin:24px auto 0;mix-blend-mode:multiply;max-width:92px;max-height:92px}@keyframes shake{0%,100%{rotate:0}25%{rotate:-10deg}50%{rotate:0}75%{rotate:10deg}}@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}@keyframes drift{to{transform:translate(18px,-22px)}}@keyframes up{from{transform:translateY(110vh);opacity:0}15%{opacity:.7}to{transform:translateY(-15vh) rotate(25deg);opacity:0}}
</style></head><body><div class="app" id="app"><div class="hearts" id="hearts"></div><div class="particles" id="particles"></div><div class="floating" id="floating"></div><main class="modal"><div class="face" id="face"><img id="reactionGif" alt="cat reaction"></div><h1 id="title">Will you go out with me?</h1><div class="buttons" id="buttons"><button class="yes" id="yes">YES+</button><button class="no" id="no">NO</button></div><div class="sub hidden" id="sub"></div><input id="date" class="date hidden" type="text" placeholder="MM/DD/YYYY" maxlength="10"><button class="continue hidden" id="cont">PRESS TO CONTINUE</button></main></div><script>
const $=id=>document.getElementById(id);const app=$("app"),face=$("face"),reactionGif=$("reactionGif"),title=$("title"),buttons=$("buttons"),yes=$("yes"),no=$("no"),sub=$("sub"),date=$("date"),cont=$("cont"),hearts=$("hearts"),particles=$("particles"),floating=$("floating");let state=0,noPresses=0;
const happy='https://media1.tenor.com/m/MKkJWYigjycAAAAd/cute-cat-cat-cute.gif';const postYesCat='https://media.tenor.com/CnP64S7lszwAAAAj/meme-cat-cat-meme.gif';
const gifs=[happy,'https://media1.tenor.com/m/cxTH4XWKUVIAAAAd/cat.gif','https://media1.tenor.com/m/wk8ueqUDJBsAAAAd/cat-cry-cute.gif','https://media1.tenor.com/m/d9PoZm99CTgAAAAd/sadcat-crying-cat.gif','https://media1.tenor.com/m/hLuI_mGw57cAAAAd/sad-cat.gif','https://media1.tenor.com/m/wk8ueqUDJBsAAAAd/cat-cry-cute.gif','https://media1.tenor.com/m/d9PoZm99CTgAAAAd/sadcat-crying-cat.gif','https://media1.tenor.com/m/hLuI_mGw57cAAAAd/sad-cat.gif','https://media1.tenor.com/m/wk8ueqUDJBsAAAAd/cat-cry-cute.gif'];
const S=[
['radial-gradient(circle at 50% 30%,#5b2a57 0%,#281832 52%,#100914 100%)','50%','42%','80px','YES+','18px','rgba(255,80,120,.3)','12px 30px','NO','16px','#aaa',''],
['radial-gradient(circle at 50% 30%,#5b2a57 0%,#281832 52%,#100914 100%)','50%','42%','80px','YES+','18px','rgba(255,80,120,.3)','12px 30px','No','14px','#888','Are you sure?'],

['radial-gradient(circle at 50% 35%,#9b4f79 0%,#55274f 52%,#211327 100%)','50%','42%','100px','YES!','26px','#ff5078','14px 36px','No','10px','#555','I really want you to say yes :<'],
['linear-gradient(135deg,#f7a6bc,#f5c4d8,#dfc8ee)','50%','42%','60px','YES','28px','#ff4d6d','16px 44px','No','8px','#ccc','Nooo... please don\'t :<'],

['linear-gradient(135deg,#ef9ab5,#d8759c,#a66d9d)','50%','42%','40px','YES','36px','#ff2e63','20px 0','No','4px','transparent','You\'re breaking my heart... :<'],
['linear-gradient(135deg,#c97996,#8b557d,#4c3d68)','50%','42%','30px','YES','38px','#c1121f','20px 40px','No','10px','#777','heart broken'],
['linear-gradient(135deg,#c97996,#8b557d,#4c3d68)','50%','42%','30px','YES','40px','#b00','20px 40px','No','9px','#777','Please... one more chance? :<']];
function apply(n){state=n;const s=S[n];reactionGif.src=gifs[n];app.style.background=s[0];face.classList.toggle('hidden',n===8);Object.assign(face.style,{left:'50%',top:'38%',width:s[3],height:s[3],transform:'translate(-50%,-50%)'});title.textContent=n>=7?'will you go out with me?':'Will you go out with me?';title.style.cssText=`font-size:${n>=7?'22px':'24px'};opacity:${n===8?.3:1};top:${n>=7?'12%':'12%'};color:#fff;text-shadow:${n===4?'0 0 10px rgba(0,0,0,.3)':'none'}`;yes.textContent='YES';yes.style.cssText=`font-size:${s[5]};background:${s[6]};padding:${s[7]};color:#fff;border:2px solid #ff5078;border-radius:40px;transition:all .4s ease;${n===6?'width:80%':''}`;const scale=Math.max(.28,Math.pow(.72,noPresses));no.textContent=s[8];no.style.cssText=`font-size:${Math.max(4,16*scale)}px;padding:${Math.max(1,10*scale)}px ${Math.max(2,24*scale)}px;min-width:${Math.max(14,55*scale)}px;height:${Math.max(14,42*scale)}px;opacity:${Math.max(.08,1-noPresses*.075)};border:1px solid ${s[10]};border-radius:40px;background:transparent;color:#fff;display:block;transition:all .4s ease`;sub.textContent=s[11];sub.classList.toggle('hidden',!s[11]);sub.style.cssText=`margin-top:12px;color:${n===3?'#ff99bb':n>=4?'#ff4d6d':'#fff'};font-size:${n===3?'16px':n===4?'18px':n>=5?'16px':'14px'};font-style:${n===4||n===5?'italic':'normal'};font-weight:${n===3?'bold':'normal'};opacity:.85;text-shadow:${n>=6?'0 0 10px #ff2e63':'none'}`;particles.style.opacity=n===5?1:0;hearts.style.opacity=n>=1?1:0;floating.style.opacity=n>=4?1:0;buttons.classList.remove('hidden');cont.classList.add('hidden');date.classList.add('hidden')}
function base(bg){app.style.background=bg;face.classList.add('hidden');buttons.classList.add('hidden');sub.classList.add('hidden');particles.style.opacity=0;hearts.style.opacity=1}
function show9(){state=9;base('linear-gradient(135deg,#ff9a9e,#fecfef,#f5b7c8)');floating.style.opacity=1;makeFloat();title.innerHTML="I'm so glad you said yes.<div><img class='postcat confirmcat' src='"+postYesCat+"' alt='happy cat'></div>";title.style.cssText='position:absolute;top:12%;font-size:28px;color:#fff;font-weight:700';cont.textContent='PRESS TO CONTINUE';cont.classList.remove('hidden')}
function show10(){state=10;base('linear-gradient(135deg,#fbc2eb,#a6c1ee)');makeFloat();title.innerHTML="YAY!<div style='font-size:20px;font-weight:400;margin-top:10px'>I'm so glad u said yes.</div><div style='font-size:26px;font-weight:700;margin-top:28px'>PICK A DATE</div>";title.style.cssText='position:absolute;top:10%;font-size:48px;color:#ff4d6d;font-weight:900';date.classList.remove('hidden');date.value='';date.style.cssText='display:block;position:absolute;top:47%;width:80%;padding:12px 20px;border:2px solid #ff4d6d;border-radius:30px;font-size:18px;text-align:center;outline:0;margin:0;z-index:4';cont.textContent='CONTINUE →';cont.classList.remove('hidden')}
function makeFloat(){floating.innerHTML='';for(let i=0;i<20;i++){const x=document.createElement('span');x.textContent=i%4===0?'🍬':i%5===0?'♡':'♥';x.style.left=Math.random()*100+'%';x.style.animationDelay=Math.random()*3+'s';x.style.animationDuration=2.5+Math.random()*2+'s';floating.appendChild(x)}floating.style.opacity=1}
function show11(){state=11;base('linear-gradient(135deg,#fbc2eb,#a6c1ee)');makeFloat();title.textContent='PICK A DATE';title.style.cssText='position:absolute;top:18%;font-size:30px;color:#fff;font-weight:700';sub.classList.remove('hidden');sub.textContent='Choose the day for our cute little plan.';sub.style.cssText='margin-top:12px;color:#fff;opacity:.8;font-size:16px';date.classList.remove('hidden');cont.textContent='CONTINUE →';cont.classList.remove('hidden')}
function fmt(v){const p=v.split('/');if(p.length===3){const d=new Date(+p[2],+p[0]-1,+p[1]);if(!isNaN(d))return d.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'})}return v}
function show12(){state=12;base('linear-gradient(135deg,#fbc2eb,#a6c1ee)');makeFloat();[...floating.children].forEach(x=>x.style.animationDuration='1.8s');title.textContent="IT'S A DATE!";title.style.cssText='position:absolute;top:32%;font-size:36px;color:#fff;font-weight:700;text-shadow:0 0 20px #ff4d6d';sub.classList.remove('hidden');sub.textContent='DATE: '+fmt(date.value||'08/06/2026');sub.style.cssText='margin-top:120px;color:#fff;opacity:1;font-size:20px';date.classList.add('hidden');cont.classList.add('hidden')}
yes.onclick=()=>show9();no.onclick=()=>{if(state<8){noPresses++;apply(state+1)}};cont.onclick=()=>{if(state===9)show10();else if(state===10){if(!date.value.trim())date.value='08/06/2026';show12()}else if(state===11){if(!date.value.trim())date.value='08/06/2026';show12()}};apply(0);
</script></body></html>
